# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# You'll be asked for the three values marked `sync: false`.
services:
  - type: web
    name: awaazdesk
    runtime: docker
    plan: free
    region: singapore          # Closest Render region to Gnani's Indian endpoints.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GNANI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEMO_ACCESS_CODE  # Share this with reviewers; leave the URL useless without it.
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      - key: DAILY_CALL_LIMIT
        value: "150"
      - key: DAILY_LLM_LIMIT
        value: "800"
      - key: MAX_CALL_SECONDS
        value: "300"
      - key: MAX_LIVE_CALLS
        value: "4"
      - key: AUTO_PUBLISH_SAMPLE   # Free-tier disk is ephemeral: publish the sample on each fresh start.
        value: "true"
